name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install verified Flutter SDK
        shell: bash
        run: |
          flutter_archive="$RUNNER_TEMP/flutter-sdk.tar.xz"
          curl --fail --show-error --location --retry 2 --max-time 300 \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.7-stable.tar.xz \
            --output "$flutter_archive"
          echo "af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230  $flutter_archive" | sha256sum --check -
          tar -xf "$flutter_archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Install locked generator dependencies
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: setup
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - name: Install pinned launcher renderer
        run: python3 -m pip install --require-hashes -r tools/requirements-icons.txt
      - name: Resolve Flutter dependencies
        working-directory: packages/flutter
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test
        env:
          NDS_REVIEW_SHOTS: ${{ github.workspace }}/.build/flutter-visual
        run: |
          mkdir -p .build/flutter-visual
          bash tools/with-renderer-zlib.sh just check test
          bunx playwright install --with-deps chromium firefox webkit
          just test-browser

      - name: Retain reference UI renders
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opennetwork-design-${{ github.sha }}
          path: |
            .build/visual/
            .build/flutter-visual/
            .build/browser-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: swift
            os: ubuntu-26.04
          - target: kotlin
            os: ubuntu-26.04
          - target: rust
            os: ubuntu-26.04
          - target: apple
            os: macos-15
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        if: matrix.target == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          cache: false
      - name: Compile and test the source package
        if: matrix.target != 'apple'
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/check-platforms.sh "$TARGET"
      - name: Compile and test SwiftUI bindings on Apple
        if: matrix.target == 'apple'
        run: |
          swift build --package-path packages/apple -Xswiftc -warnings-as-errors
          swift test --package-path packages/apple

  quality:
    if: ${{ !cancelled() }}
    needs: [reference, platforms]
    runs-on: ubuntu-26.04
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - name: Require every package and reference check
        env:
          REFERENCE: ${{ needs.reference.result }}
          PLATFORMS: ${{ needs.platforms.result }}
        run: test "$REFERENCE" = success && test "$PLATFORMS" = success

  workflows:
    permissions:
      contents: read
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
    with:
      hosted-runner: ubuntu-26.04
