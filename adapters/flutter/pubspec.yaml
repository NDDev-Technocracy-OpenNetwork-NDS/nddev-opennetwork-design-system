name: nddev_opennetwork_design_system
description: Open NDDev OpenNetwork design tokens and Flutter theme primitives.
version: 0.0.1-alpha.9
repository: https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system
issue_tracker: https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system/issues
license: Apache-2.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
  assets:
    - fonts/OFL-IBM-Plex.txt
