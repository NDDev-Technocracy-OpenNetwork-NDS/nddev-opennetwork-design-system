# std-0001 repository manifest — schema: `nddev schema manifest`.
apiVersion: nddev.ai/v1alpha3
kind: Repository
metadata:
  id: nddev-opennetwork-design-system
  locator: github:NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system
  owner: rldyourmnd
spec:
  standard:
    id: std-0001
    version: 3.0.0
  role: component
  profiles:
  - design
  system:
    id: nds
    root: github:NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync
  portfolios:
  - portfolio:nddev-technocracy-opennetwork-nds
  provides:
  - name: design-tokens
    source: tokens/tokens.json
    direction: schema-first
    generated: [tokens/tokens.css]
  variations:
  - paths: [.gds]
    purpose: config
    reason: GDS-owned repository anchor and policy projections; std-0001 excludes .gds by its own boundary rule.
    decision: {state: approved, by: rldyourmnd, date: "2026-10-22", origin: document, reference: standarts/decisions/0013-estate-hygiene-and-standards-adoption.md}
  - paths: [module.yaml]
    purpose: manifest
    reason: NDS module descriptor owned by the product standards corpus.
    decision: {state: approved, by: rldyourmnd, date: "2026-10-22", origin: document, reference: standarts/decisions/0013-estate-hygiene-and-standards-adoption.md}
  - paths: [standarts.lock]
    purpose: lock
    reason: NDS contract lock pinning the standards corpus with the visual-source amendment.
    decision: {state: approved, by: rldyourmnd, date: "2026-10-22", origin: document, reference: standarts/decisions/0013-estate-hygiene-and-standards-adoption.md}
  - paths: [packages]
    purpose: package
    reason: Published Flutter package generated from the canonical tokens.
    decision: {state: approved, by: rldyourmnd, date: "2026-10-22", origin: document, reference: standarts/decisions/0013-estate-hygiene-and-standards-adoption.md}
  adapters:
  - claude
  - cursor
